<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Elete Fitness Club - Login</title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Elete Fitness Club</h1>

            <p class="subtitle">
                Renewal Management
            </p>


            <h2>Admin Login</h2>


            <input
                type="text"
                id="username"
                placeholder="Username"
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
            >


            <button onclick="login()">
                Login
            </button>


            <p id="error"></p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
